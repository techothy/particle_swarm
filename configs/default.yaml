results_dir: results

data:
  max_docs: 1500
  test_size: 0.2
  subset: all

pso:
  population: 25
  max_iter: 50
  seed: 41
  stagnation_patience: 8

fitness:
  cv_folds: 5
  min_features: 50
  max_features: 8000
  vocab_penalty: 0.02
  mode: cv_f1

baselines:
  grid_min_df: [0.001, 0.005, 0.01, 0.02, 0.05]
  grid_max_df: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4]
  random_search_trials: 125

raw_baseline_min_df: 5
raw_baseline_max_df: 0.8
raw_baseline_max_features: 1500
