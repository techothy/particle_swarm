[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pso-tfidf"
version = "0.1.0"
description = "Particle Swarm Optimization for TF-IDF min_df/max_df tuning on text classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "gensim>=4.3",
  "nltk>=3.8",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["customtkinter>=5.2", "Pillow>=10.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
